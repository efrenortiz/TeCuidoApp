{% extends "layouts/auth_base.html" %}
{% block title %}Cambiar contraseña — TeCuidoApp{% endblock %}
{% block auth_content %}
<h1>Cambiar contraseña</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "components/_form_fields.html" %}
  <button type="submit" class="btn btn--primary btn--block">Guardar</button>
</form>
<p class="auth-layout__link-row">
  <a href="{% url 'home' %}">Volver a Inicio</a>
</p>
{% endblock %}
